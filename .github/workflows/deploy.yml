name: Deploy static site

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure static files exist
        run: |
          test -f index.html
          test -f assets/css/styles.css
          test -f assets/js/app.js
      - name: Upload artifact
        run: echo "Static site ready for deployment."
