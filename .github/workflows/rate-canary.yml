name: Rate canary

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

jobs:
  verify-rates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify rate file
        run: node scripts/verify-rates.mjs
